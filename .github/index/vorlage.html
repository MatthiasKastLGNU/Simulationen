<style>
:root {
	--blue-frame:  #0000BF;
	--blue-title:  #F2F2FF;
	--red-frame:   #BF0000;
	--red-title:   #FFF2F2;
	--green-frame: #295C06;
	--green-title: #F5FAF3;
	--text:        #111111;
	--grau:        #6b6b6b;
	--hell:        #e6e6ee;
	--seite:       #ffffff;
	--schrift: 'Libertinus Sans', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
	margin: 0; background: var(--seite); color: var(--text);
	font-family: var(--schrift); font-size: 17px; line-height: 1.35;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; }

/* Kopf im Stil einer tcolorbox */
.kopf {
	border: 2px solid var(--blue-frame); border-radius: 4px; background: var(--blue-title);
	padding: 12px 16px; display: flex; align-items: center; gap: 14px;
}
.kopf svg { flex: none; }
.kopf h1 { margin: 0; font-size: 1.6em; font-weight: bold; color: var(--blue-frame); }
.kopf p { margin: 2px 0 0; color: var(--grau); font-size: 0.92em; }

/* Bedienleiste */
.leiste {
	position: sticky; top: 0; z-index: 5; background: var(--seite);
	display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px;
	padding: 12px 0 10px; border-bottom: 1px solid var(--hell);
}
.gruppe { display: flex; flex-direction: column; gap: 3px; }
.gruppe > span { font-size: 0.72em; color: var(--grau); letter-spacing: .02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
	font: inherit; font-size: 0.95em; min-width: 3.1em; padding: 5px 10px; cursor: pointer;
	border: 1.5px solid #c8c8d4; border-radius: 4px; background: #f3f3f6; color: var(--text);
}
a.chip { display: inline-block; text-align: center; text-decoration: none; }
.chip:hover { border-color: var(--blue-frame); }
.chip[aria-current="page"] {
	border-color: var(--blue-frame); background: var(--blue-frame); color: #fff;
	box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
}
.suche { position: relative; flex: 1 1 220px; max-width: 360px; }
.suche svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.suche input {
	width: 100%; font: inherit; font-size: 0.95em; padding: 6px 30px 6px 32px;
	border: 1.5px solid #c8c8d4; border-radius: 4px; background: #fff; color: var(--text);
}
.suche input:focus { outline: none; border-color: var(--blue-frame); }
.suche button {
	position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: none;
	border: 0; background: none; cursor: pointer; color: var(--grau); font-size: 1.1em; padding: 2px 6px;
}
.suche.voll button { display: block; }
.anzahl { margin-left: auto; color: var(--grau); font-size: 0.85em; align-self: center; }

/* Gliederung */
h2.klasse {
	margin: 26px 0 4px; font-size: 1.35em; color: var(--blue-frame);
	border-bottom: 2px solid var(--blue-frame); padding-bottom: 2px;
}
h3.kapitel { margin: 18px 0 2px; font-size: 0.95em; font-weight: normal; color: var(--grau); }
h3.kapitel b { color: var(--grau); font-weight: bold; }
h4.abs {
	margin: 4px 0 8px; font-size: 1.12em; font-weight: bold;
	display: flex; align-items: center; gap: 9px;
	border-left: 4px solid var(--themafarbe, transparent); padding-left: 8px;
}
.pikto {
	flex: none; width: 30px; height: 30px; border-radius: 6px; color: #fff;
	display: grid; place-items: center;
}
.kopf > div { flex: 1; min-width: 0; }
.seitenqr {
	flex: none; width: 52px; height: 52px; cursor: pointer; border-radius: 4px;
	border: 1.5px solid var(--blue-frame); background: #fff; color: var(--blue-frame);
	display: grid; place-items: center;
}
.seitenqr:hover { background: var(--blue-frame); color: #fff; }
.abschnitt > .titel .niveau { font-weight: normal; }
.abschnitt {
	border: 2px solid var(--blue-frame); border-radius: 4px; margin: 0 0 14px; overflow: hidden;
}
.abschnitt > .titel {
	background: var(--blue-title); color: var(--blue-frame); font-weight: bold;
	padding: 5px 12px; border-bottom: 1px solid #ccd;
}
.raster {
	display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
	gap: 10px; padding: 10px;
}

/* Karte */
.karte {
	position: relative; display: flex; align-items: stretch;
	border: 1.5px solid #d4d4de; border-radius: 4px; background: #fff;
	transition: border-color .12s, box-shadow .12s;
}
.karte:hover { border-color: var(--blue-frame); box-shadow: 0 2px 8px rgba(0,0,191,.12); }
.karte a {
	flex: 1; min-width: 0; padding: 8px 10px; color: inherit; text-decoration: none;
	display: flex; flex-direction: column; gap: 3px;
}
.karte a:focus-visible { outline: 2px solid var(--blue-frame); outline-offset: -2px; }
.karte .ab { font-size: 0.75em; color: var(--grau); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.karte .name { font-size: 1.05em; }
.karte .name::after { content: " ›"; color: var(--blue-frame); }
.niveau {
	display: inline-block; font-size: 0.85em; padding: 0 5px; border-radius: 3px; margin-left: 4px;
	border: 1px solid; vertical-align: 1px;
}
.niveau.eA { color: var(--red-frame); background: var(--red-title); }
.niveau.gA { color: var(--green-frame); background: var(--green-title); }
.qr {
	flex: none; width: 40px; border: 0; border-left: 1px solid #e3e3ea; background: #fafafc;
	cursor: pointer; display: grid; place-items: center; color: #555; border-radius: 0 3px 3px 0;
}
.qr:hover { background: var(--blue-title); color: var(--blue-frame); }
.leer { color: var(--grau); padding: 30px 0; text-align: center; }
mark { background: #fff1a8; color: inherit; padding: 0; }

/* QR-Overlay zum Projizieren */
.overlay {
	position: fixed; inset: 0; z-index: 20; background: rgba(20,20,40,.55);
	display: none; align-items: center; justify-content: center; padding: 16px;
}
.overlay.offen { display: flex; }
.qrbox {
	background: #fff; border: 2px solid var(--blue-frame); border-radius: 4px; max-width: 92vw;
	padding: 0 0 16px; text-align: center; position: relative;
}
.qrbox .titel {
	background: var(--blue-title); color: var(--blue-frame); font-weight: bold; font-size: 1.2em;
	padding: 8px 48px; border-bottom: 1px solid #ccd;
}
.qrbox #qrbild { padding: 18px 18px 8px; display: inline-block; }
.qrbox #qrbild svg { width: min(70vmin, 420px); height: auto; display: block; }
.qrbox .url { font-size: 0.8em; color: var(--grau); word-break: break-all; padding: 0 16px; }
.qrbox .zu {
	position: absolute; right: 6px; top: 5px; border: 0; background: none; cursor: pointer;
	color: var(--blue-frame); font-size: 1.5em; line-height: 1; padding: 4px 8px;
}
.qrbox .oeffnen {
	display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 4px;
	background: var(--blue-frame); color: #fff; text-decoration: none;
}
footer { margin-top: 30px; color: var(--grau); font-size: 0.8em; text-align: center; }

@media (max-width: 560px) {
	body { font-size: 16px; }
	.kopf h1 { font-size: 1.3em; }
	.anzahl { display: none; }
	.raster { grid-template-columns: 1fr; padding: 8px; }
}
</style>

	 svg: '<path d="M5 3v9a7 7 0 0 0 14 0V3h-4.5v9a2.5 2.5 0 0 1-5 0V3z" fill="currentColor"/><path d="M5 3h4.5v3H5zM14.5 3H19v3h-4.5z" fill="#fff" opacity=".75"/>'},
	{name: 'Elektrisches Feld', farbe: '#ad1457', re: /elektrisch|e-feld|ladung|coulomb|influenz|feldst|potential/,
	 svg: '<circle cx="6" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.8 12h4.4M6 9.8v4.4" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.8 12h4.4" stroke="currentColor" stroke-width="1.8"/>'},
	{name: 'Mechanik & Energie', farbe: '#455a64', re: /bewegung|impuls|wurf|kreis|energie|leistung|arbeit|kraft/,
	 svg: '<circle cx="7" cy="12" r="4" fill="currentColor"/><path d="M12 12h9M17.5 8.5 21 12l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'},
];
function thema(k, s) {
	const kn = DATEN.klassen[k];
	for (const text of [kn[s.abs], kn[s.kap], s.titel]) {
		if (!text) continue;
		const t = text.toLowerCase();
		const th = THEMEN.find(x => x.re.test(t));
		if (th) return th;
	}
	return null;
}
const piktogramm = th => th
	? '<span class="pikto" style="background:' + th.farbe + '" title="' + th.name + '"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">' + th.svg + '</svg></span>'
	: '';

// Klassen-Chips: echte Links auf Klasse_<nn>/
function chipsBauen() {
	const c = $('chips');
	c.innerHTML = '';
	for (const k of ['', ...klassen]) {
		const a = document.createElement('a');
		a.className = 'chip';
		a.textContent = k ? nr(k) : 'Alle';
		a.title = k ? 'Klasse ' + nr(k) : 'Alle Klassen';
		a.href = PRAEFIX + (k ? 'Klasse_' + k + '/' : '');
		a.onclick = () => { const q = $('suche').value.trim(); if (q) a.href += '?suche=' + encodeURIComponent(q); };
		if (k === aktiv) a.setAttribute('aria-current', 'page');
		c.appendChild(a);
	}
}

function zeigen() {
	const q = $('suche').value.trim();
	$('suchfeld').classList.toggle('voll', !!q);
	const woerter = norm(q).split(/\s+/).filter(Boolean);
	history.replaceState(null, '', location.pathname + (q ? '?suche=' + encodeURIComponent(q) : ''));
	$('ueberschrift').textContent = aktiv ? 'Physik-Simulationen · Klasse ' + nr(aktiv) : 'Physik-Simulationen';
	document.title = aktiv ? 'Simulationen Klasse ' + nr(aktiv) : 'Physik-Simulationen';

	const treffer = DATEN.sims.filter(s => {
		if (aktiv && s.k !== aktiv) return false;
		if (!woerter.length) return true;
		const kn = DATEN.klassen[s.k];
		const heu = norm([s.titel, s.ab, s.niveau, s.pfad, kn[s.kap] || '', kn[s.abs] || '', kn[s.ab] || '', 'klasse ' + nr(s.k)].join(' '));
		return woerter.every(w => heu.includes(w));
	});
	$('anzahl').textContent = treffer.length === 1 ? '1 Simulation' : treffer.length + ' Simulationen';

	const main = $('liste');
	main.innerHTML = '';
	if (!treffer.length) { main.innerHTML = '<p class="leer">Keine Simulation gefunden.</p>'; return; }

	for (const k of klassen) {
		const rang = n => (n === '' ? '0' : n === 'gA' ? '1' : '2') + n;
		const sims = treffer.filter(s => s.k === k)
			.sort((a, b) => codeSort(a.ab).localeCompare(codeSort(b.ab)) || rang(a.niveau).localeCompare(rang(b.niveau)) || a.titel.localeCompare(b.titel, 'de'));
		if (!sims.length) continue;
		const kn = DATEN.klassen[k];
		if (!aktiv) {
			const h = document.createElement('h2');
			h.className = 'klasse'; h.id = 'klasse-' + nr(k); h.textContent = 'Klasse ' + nr(k);
			main.appendChild(h);
		}
		let kap = null, abs = null, blatt = null, raster = null;
		for (const s of sims) {
			if (s.kap !== kap || s.abs !== abs) {
				if (s.kap !== kap) {
					const h = document.createElement('h3');
					h.className = 'kapitel';
					h.innerHTML = s.kap ? '<b>' + esc(s.kap) + '</b> · ' + markiere(kn[s.kap] || '', woerter) : '<b>Weitere</b>';
					main.appendChild(h);
				}
				kap = s.kap; abs = s.abs; blatt = null;
				if (abs) {
					const h = document.createElement('h4');
					h.className = 'abs';
					const th = thema(k, s);
					if (th) h.style.setProperty('--themafarbe', th.farbe);
					h.innerHTML = piktogramm(th) + '<span>' + esc(abs) + ' ' + markiere(kn[abs] || '', woerter) + '</span>';
					main.appendChild(h);
				}
			}
			const blattNeu = s.ab + '|' + s.niveau;
			if (blattNeu !== blatt) {
				blatt = blattNeu;
				const box = document.createElement('section');
				box.className = 'abschnitt';
				const niv = s.niveau ? '<span class="niveau ' + s.niveau.slice(0, 2) + '">' + esc(s.niveau) + '</span>' : '';
				box.innerHTML = '<div class="titel">' + (s.ab ? esc(s.ab) + ' ' + markiere(kn[s.ab] || '', woerter) : 'Ohne Zuordnung') + niv + '</div>';
				raster = document.createElement('div');
				raster.className = 'raster';
				box.appendChild(raster);
				main.appendChild(box);
			}
			const karte = document.createElement('div');
			karte.className = 'karte';
			karte.innerHTML =
				'<a href="' + esc(PRAEFIX + s.pfad) + '" target="_blank" rel="noopener">' +
					'<span class="name">' + markiere(s.titel, woerter) + '</span>' +
				'</a>' +
				'<button class="qr" type="button" title="QR-Code zeigen" aria-label="QR-Code für ' + esc(s.titel) + ' zeigen">' +
					'<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" fill="currentColor"><path d="M2 2h7v7H2zM4 4v3h3V4zM11 2h7v7h-7zM13 4v3h3V4zM2 11h7v7H2zM4 13v3h3v-3zM11 11h3v3h-3zM14 14h4v4h-4zM11 15h2v3h-2zM16 11h2v2h-2z"/></svg>' +
				'</button>';
			karte.querySelector('.qr').onclick = () => qrZeigen(s);
			raster.appendChild(karte);
		}
	}
}

// QR-Code zum Projizieren
let qrZuletzt = null;
function qrZeigen(s) {
	const url = BASIS + s.pfad;
	qrOeffnen(s.titel + (s.niveau ? ' (' + s.niveau + ')' : ''), url, PRAEFIX + s.pfad);
}
const QR_LOGO = '<defs><clipPath id="qrlogo"><rect x="1.5" y="5" width="22" height="22" rx="2.5"/></clipPath></defs><rect x="1.5" y="5" width="22" height="22" rx="2.5" fill="#F7F7FF"/><path clip-path="url(#qrlogo)" stroke="#D4D4F2" stroke-width="0.5" d="M7 5V27M12.5 5V27M18 5V27M1.5 10.5H23.5M1.5 16H23.5M1.5 21.5H23.5"/><path d="M23.5 13.2V7.5Q23.5 5 21 5H4Q1.5 5 1.5 7.5V24.5Q1.5 27 4 27H21Q23.5 27 23.5 24.5V24.3" fill="none" stroke="#0000BF" stroke-width="2.2" stroke-linecap="round"/><path d="M6 20.476 C6.547 19.822 7.093 18.841 7.64 17.717 C8.187 16.594 8.733 15.333 9.28 14.169 C9.827 13.005 10.373 11.945 10.92 11.186 C11.467 10.427 12.013 9.973 12.56 9.908 C13.107 9.844 13.653 10.169 14.2 10.824 C14.747 11.478 15.293 12.459 15.84 13.583 C16.387 14.706 16.933 15.967 17.48 17.131 C18.027 18.295 18.573 19.355 19.12 20.114 C19.667 20.873 20.213 21.327 20.76 21.392 C21.307 21.456 21.853 21.131 22.4 20.476 L28.4 13.292" fill="none" stroke="#0000BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28.55" cy="13.092" r="2.5" fill="#BF0000"/>';
function qrSvg(url) {
	const q = qrcode(0, 'H'); q.addData(url); q.make();
	const n = q.getModuleCount(), z = 4, T = n + 2 * z, F = '#0000BF';
	const ecke = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
	const ls = Math.round(n * 0.24) | 1, l0 = (n - ls) / 2;
	const logo = (r, c) => r >= l0 && r < l0 + ls && c >= l0 && c < l0 + ls;
	// abgerundetes Rechteck als Pfad (wie auf den Arbeitsblättern: Module abgerundet, Ecken leicht gerundet)
	const rr = (x, y, w, h, k) => 'M' + +(x + k).toFixed(2) + ' ' + +y.toFixed(2) + 'h' + +(w - 2 * k).toFixed(2) + 'a' + k + ' ' + k + ' 0 0 1 ' + k + ' ' + k +
		'v' + +(h - 2 * k).toFixed(2) + 'a' + k + ' ' + k + ' 0 0 1 -' + k + ' ' + k + 'h-' + +(w - 2 * k).toFixed(2) +
		'a' + k + ' ' + k + ' 0 0 1 -' + k + ' -' + k + 'v-' + +(h - 2 * k).toFixed(2) + 'a' + k + ' ' + k + ' 0 0 1 ' + k + ' -' + k + 'z';
	let p = '';
	for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
		if (q.isDark(r, c) && !ecke(r, c) && !logo(r, c)) p += rr(c + z + 0.04, r + z + 0.04, 0.92, 0.92, 0.28);
	for (const [r, c] of [[0, 0], [0, n - 7], [n - 7, 0]]) {
		const x = c + z, y = r + z;
		p += rr(x, y, 7, 7, 0.5) + rr(x + 1, y + 1, 5, 5, 0.35) + rr(x + 2, y + 2, 3, 3, 0.25);
	}
	return '<svg viewBox="0 0 ' + T + ' ' + T + '" role="img" aria-label="QR-Code"><rect width="' + T + '" height="' + T + '" fill="#fff"/>' +
		'<path d="' + p + '" fill="' + F + '" fill-rule="evenodd"/>' +
		'<svg x="' + (l0 + z) + '" y="' + (l0 + z) + '" width="' + ls + '" height="' + ls + '" viewBox="0 0 32 32">' + QR_LOGO + '</svg></svg>';
}
function qrOeffnen(titel, url, link) {
	$('qrtitel').textContent = titel;
	$('qrurl').textContent = url;
	$('qroeffnen').href = link || '#';
	$('qroeffnen').style.display = link ? '' : 'none';
	qrZuletzt = document.activeElement;
	$('qrbild').innerHTML = '';
	if (window.qrcode) $('qrbild').innerHTML = qrSvg(url);
	else $('qrbild').textContent = 'QR-Code konnte nicht geladen werden.';
	$('overlay').classList.add('offen');
	$('qrzu').focus();
}
function qrZu() { $('overlay').classList.remove('offen'); if (qrZuletzt) qrZuletzt.focus(); }
$('qrzu').onclick = qrZu;
$('seitenqr').onclick = () => qrOeffnen(aktiv ? 'Simulationen Klasse ' + nr(aktiv) : 'Physik-Simulationen', SEITE);
$('overlay').onclick = e => { if (e.target === $('overlay')) qrZu(); };

document.addEventListener('keydown', e => {
	if (e.key === 'Escape' && $('overlay').classList.contains('offen')) qrZu();
	else if (e.key === '/' && document.activeElement !== $('suche')) { e.preventDefault(); $('suche').focus(); }
});
$('suche').addEventListener('input', zeigen);
$('loeschen').onclick = () => { $('suche').value = ''; zeigen(); $('suche').focus(); };
if (param.get('klasse') === 'alle') aktiv = '';

chipsBauen();
zeigen();
</script>
